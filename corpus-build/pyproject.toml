[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-build"
version = "0.1.0"
description = "A graph-of-versioned-artifacts model for speech corpus provenance"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
files = ["src/corpus_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
