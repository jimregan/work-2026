[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "irish-parse"
version = "0.1.0"
description = "Parse pre-standard Irish with Stanza, cross-checked against UDPipe"
requires-python = ">=3.9"
dependencies = [
    "stanza>=1.7",
    "ufal.udpipe>=1.3.1.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["parse_irish"]

[tool.setuptools.packages.find]
include = ["irish_parse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
